<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>毕业那天你会去哪</title>
<style>
  :root{
    --paper:#f8f2e6;
    --paper2:#fdfaf3;
    --ink:#2b2621;
    --ink2:#6e6458;
    --ink3:#9a9084;
    --red:#9c3b30;
    --green:#4c6b58;
    --line:rgba(43,38,33,.14);
    --serif:"Songti SC","SimSun","STSong",serif;
    --kai:"Kaiti SC","KaiTi","STKaiti","SimSun",serif;
    --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    margin:0;min-height:100%;
    background:radial-gradient(120% 90% at 50% -10%,#f1eadd 0%,#e7dece 45%,#ded4c1 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
    padding:28px 16px 64px;
  }
  /* ---------- 四季背景 ---------- */
  body{transition:background .9s ease}
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(45% 34% at 10% 6%,var(--glow1,transparent) 0%,transparent 62%),
      radial-gradient(55% 44% at 92% 94%,var(--glow2,transparent) 0%,transparent 68%);
  }
  body[data-season="autumn"]{
    --paper:#f7efdf;--paper2:#fdf8ee;--ink2:#6b5f4e;--ink3:#9b8e79;--red:#a34228;
    --glow1:rgba(216,158,66,.28);--glow2:rgba(170,112,44,.20);--wash:rgba(214,168,80,.11);
    background:linear-gradient(165deg,#f5ecd8 0%,#eddfc4 46%,#e2cda4 100%);
  }
  body[data-season="winter"]{
    --paper:#eef1f4;--paper2:#fbfcfe;--ink:#242a31;--ink2:#5f6b78;--ink3:#8e9aa6;--red:#8c4550;
    --glow1:rgba(120,150,180,.24);--glow2:rgba(90,120,150,.18);--wash:rgba(140,170,200,.12);
    background:linear-gradient(165deg,#e7ecf1 0%,#d8e0e7 46%,#c7d2dc 100%);
  }
  body[data-season="spring"]{
    --paper:#f2f5e9;--paper2:#fbfdf5;--ink:#25301f;--ink2:#5c6a4e;--ink3:#8e9a80;--red:#a05a63;
    --glow1:rgba(150,190,120,.26);--glow2:rgba(212,150,172,.16);--wash:rgba(160,200,130,.12);
    background:linear-gradient(165deg,#eaf1df 0%,#dce8cc 46%,#cadbbb 100%);
  }
  body[data-season="summer"]{
    --paper:#f0f6f4;--paper2:#fbfefd;--ink:#1f2e2c;--ink2:#4f6563;--ink3:#849a97;--red:#9a4a38;
    --glow1:rgba(90,175,165,.24);--glow2:rgba(240,190,90,.18);--wash:rgba(110,190,180,.12);
    background:linear-gradient(165deg,#e8f2ef 0%,#d5e7e2 46%,#c3dbd5 100%);
  }
  .shell{transition:background .9s ease,box-shadow .9s ease}
  .shell::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(70% 45% at 100% 0%,var(--wash,transparent) 0%,transparent 72%),
      radial-gradient(52% 36% at 0% 100%,var(--wash,transparent) 0%,transparent 70%);
  }
  #app{width:100%;max-width:660px;position:relative;z-index:1}

  .shell{
    position:relative;
    background:var(--paper2);
    border-radius:3px;
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 18px 50px rgba(50,40,25,.14),0 2px 6px rgba(50,40,25,.08);
    padding:26px 30px 34px;
    min-height:70vh;
    overflow:hidden;
  }
  .shell::before{
    content:"";position:absolute;left:52px;top:0;bottom:0;width:1px;
    background:rgba(156,59,48,.16);
  }
  .shell::after{
    content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;
    background:radial-gradient(circle at 70% 30%,rgba(198,178,140,.18),transparent 70%);
    pointer-events:none;
  }

  /* ---------- HUD ---------- */
  .hud{padding:0 0 14px;border-bottom:1px dashed var(--line);margin-bottom:22px}
  .hud-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sem{font-family:var(--kai);font-size:19px;letter-spacing:2px;color:var(--red)}
  .dots{display:flex;gap:5px;margin-left:auto}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(43,38,33,.16);display:block}
  .dots i.done{background:rgba(156,59,48,.55)}
  .dots i.now{background:var(--red);box-shadow:0 0 0 3px rgba(156,59,48,.15)}
  .bgm{font-size:15px;color:var(--ink3);cursor:pointer;padding:0 6px;user-select:none;line-height:1}
  .bgm:hover{color:var(--red)}
  .dir{font-size:11px;padding:2px 7px;border-radius:2px;letter-spacing:1px}
  .dir-k{background:rgba(156,59,48,.1);color:var(--red)}
  .dir-g{background:rgba(76,107,88,.12);color:var(--green)}
  .dir-j{background:rgba(90,90,120,.12);color:#5a5a78}
  .stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{
    font-size:11.5px;color:var(--ink3);letter-spacing:.5px;
    background:rgba(43,38,33,.04);padding:3px 8px;border-radius:2px;
    display:inline-flex;gap:4px;align-items:baseline;
  }
  .chip b{color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}

  /* ---------- 正文 ---------- */
  .prose{font-family:var(--kai);font-size:17px;line-height:2;color:var(--ink);letter-spacing:.3px}
  .prose p{margin:0 0 15px}
  .prose p:last-child{margin-bottom:0}

  .scene-title{
    font-family:var(--sans);font-size:12px;letter-spacing:3px;color:var(--ink3);
    margin-bottom:16px;text-transform:uppercase;
  }
  .scene-title::after{content:"";display:block;width:28px;height:1px;background:var(--red);margin-top:8px;opacity:.6}

  .choices{margin-top:26px;display:flex;flex-direction:column;gap:9px}
  .choice{
    appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.45);
    font-family:var(--sans);font-size:14.5px;line-height:1.6;color:var(--ink);
    text-align:left;padding:13px 16px;border-radius:2px;cursor:pointer;
    transition:background .18s,color .18s,border-color .18s,transform .12s;
  }
  .choice:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);transform:translateX(3px)}
  .choice:active{transform:translateX(1px) scale(.995)}

  .deltas,.last-action{display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 0}
  .delta{font-size:11.5px;padding:3px 8px;border-radius:2px;font-variant-numeric:tabular-nums}
  .delta.up{background:rgba(76,107,88,.12);color:var(--green)}
  .delta.down{background:rgba(156,59,48,.1);color:var(--red)}
  .last-action{margin:0 0 18px;font-size:12px;color:var(--ink3);align-items:center}

  .btn{
    appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);
    font-family:var(--sans);font-size:14px;letter-spacing:2px;padding:12px 26px;
    border-radius:2px;cursor:pointer;margin-top:26px;transition:background .18s,color .18s;
    display:block;width:100%;
  }
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn.primary{background:var(--ink);color:var(--paper)}
  .btn.primary:hover{background:var(--red);border-color:var(--red)}
  .btn.ghost{border-color:var(--line);color:var(--ink2);margin-top:10px;font-size:13px}
  .btn.ghost:hover{background:rgba(43,38,33,.06);color:var(--ink)}

  .left-hint{font-size:12.5px;color:var(--ink3);margin:14px 0 0;letter-spacing:.5px}
  .left-hint b{color:var(--red);font-size:15px}
  .acts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  .act{
    appearance:none;border:1px solid var(--line);background:transparent;text-align:left;
    padding:12px 15px;border-radius:2px;cursor:pointer;display:flex;flex-direction:column;gap:3px;
    transition:background .18s,border-color .18s,transform .12s;
  }
  .act:hover{background:rgba(43,38,33,.05);border-color:rgba(43,38,33,.3);transform:translateX(3px)}
  .a-name{font-size:14.5px;color:var(--ink);letter-spacing:.8px}
  .a-note{font-size:11.5px;color:var(--ink3)}
  .warn{font-family:var(--sans);font-size:13px;color:var(--red);background:rgba(156,59,48,.06);
    padding:9px 12px;border-left:2px solid var(--red);margin:18px 0 0}
  .note{font-family:var(--sans);font-size:13px;color:var(--ink2);background:rgba(43,38,33,.035);
    padding:9px 12px;border-left:2px solid rgba(43,38,33,.18);margin:10px 0 0;line-height:1.7}

  /* ---------- 翻页与月度小结 ---------- */
  .shell{transform-origin:left center;backface-visibility:hidden}
  .shell.flip{animation:pageflip .62s cubic-bezier(.2,.85,.25,1)}
  @keyframes pageflip{
    0%{transform:perspective(1400px) rotateY(-14deg) translateX(-8px);opacity:.25;
       box-shadow:26px 0 40px rgba(50,40,25,.28)}
    55%{transform:perspective(1400px) rotateY(2deg);opacity:1}
    100%{transform:none;opacity:1}
  }
  .summary{padding-top:14px}
  .sum-tag{font-size:11px;letter-spacing:3px;color:var(--red);opacity:.85;margin-bottom:14px}
  .sum-title{font-family:var(--serif);font-size:24px;letter-spacing:3px;margin:0 0 20px;font-weight:600}
  .sum-block{margin-bottom:16px}
  .sum-lb{font-size:11px;letter-spacing:2px;color:var(--ink3);display:block;margin-bottom:7px}
  .sum-acts,.sum-lines{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px}
  .sum-acts li{font-family:var(--kai);font-size:15px;color:var(--ink);padding-left:14px;position:relative}
  .sum-acts li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:1px;background:var(--ink3)}
  .sum-acts li.none{color:var(--ink3)}
  .sum-lines li{font-size:12.5px;color:var(--ink2);line-height:1.7;padding-left:10px;
    border-left:2px solid rgba(156,59,48,.25);margin-left:2px}
  .sum-stats{font-size:11.5px;color:var(--ink3);letter-spacing:1px;
    border-top:1px dashed var(--line);padding-top:12px;margin-top:6px}

  /* ---------- 主界面：人物 + 右列 ---------- */
  .game{display:flex;gap:20px;align-items:flex-start;margin-top:6px}
  .stage{flex:0 0 218px;display:flex;flex-direction:column;align-items:center;gap:7px;padding-top:4px}
  .avatar{width:190px;height:auto;display:block}
  .g-date{font-family:var(--kai);font-size:15px;letter-spacing:2px;color:var(--ink2)}
  .g-crumb{font-size:11.5px;color:var(--ink3);letter-spacing:1px;text-align:center;min-height:16px;line-height:1.5}
  .g-energy{width:150px;height:5px;background:rgba(43,38,33,.08);border-radius:3px;overflow:hidden;margin-top:6px}
  .g-energy i{display:block;height:100%;background:var(--green);transition:width .35s}
  .g-state{font-size:10.5px;color:var(--ink3);letter-spacing:1.5px}
  .rail{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .rbtn{
    appearance:none;border:1px solid var(--line);background:transparent;text-align:left;
    padding:9px 12px;border-radius:2px;cursor:pointer;display:flex;gap:9px;align-items:center;
    width:100%;transition:background .18s,border-color .18s,transform .12s;
  }
  .rbtn:hover{background:rgba(43,38,33,.05);border-color:rgba(43,38,33,.28);transform:translateX(2px)}
  .r-ico{font-size:16px;width:20px;text-align:center;flex:0 0 20px}
  .r-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .r-txt b{font-family:var(--kai);font-size:15px;font-weight:400;color:var(--ink);letter-spacing:1px}
  .r-txt i{font-style:normal;font-size:10.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rbtn.go{background:var(--ink);border-color:var(--ink);justify-content:center;margin-top:8px}
  .rbtn.go b{color:var(--paper)}
  .rbtn.go i{color:rgba(253,250,243,.6)}
  .prose.small{font-size:14.5px;line-height:1.9}
  .effect-text{font-family:var(--kai);font-size:15px;line-height:1.95;color:var(--ink);letter-spacing:.2px;margin:2px 0 0}
  .effect-text p{margin:0 0 8px}
  .effect-text p:last-child{margin-bottom:0}
  .rail .back{text-align:left;margin-bottom:2px}
  .rbtn.attend{border-color:rgba(76,107,88,.4);background:rgba(76,107,88,.05)}
  .rbtn.attend.done{opacity:.55;background:transparent;border-color:var(--line)}
  .rbtn.attend.done b{color:var(--ink3)}
  .empty{font-size:12px;color:var(--ink3);padding:14px 0;line-height:1.8}
  .mask{position:fixed;inset:0;background:rgba(30,26,22,.42);display:flex;align-items:center;
    justify-content:center;z-index:99;padding:20px}
  .dialog{background:var(--paper2);border-radius:3px;padding:24px 22px 18px;max-width:340px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .dialog p{font-family:var(--sans);font-size:13.5px;line-height:1.9;color:var(--ink);margin:0 0 18px}
  .dialog p b{color:var(--red);font-size:16px}
  .dbtns{display:flex;gap:9px}
  .dbtns button{
    appearance:none;flex:1;padding:10px 0;border-radius:2px;cursor:pointer;
    font-family:var(--sans);font-size:13px;letter-spacing:1px;border:1px solid var(--line);
    background:transparent;color:var(--ink2);
  }
  .dbtns .dyes{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .dbtns .dyes:hover{background:var(--red);border-color:var(--red)}

  /* ---------- 封面 ---------- */
  .cover{min-height:calc(70vh - 70px);display:flex;flex-direction:column;justify-content:center;padding:10px 0}
  .kicker{font-size:11.5px;letter-spacing:4px;color:var(--ink3);margin-bottom:26px}
  .cover h1{
    font-family:var(--serif);font-size:44px;line-height:1.35;margin:0 0 24px;
    letter-spacing:5px;font-weight:600;
  }
  .cover h1 em{font-style:normal;color:var(--red)}
  .cover-sub{font-family:var(--kai);font-size:15.5px;line-height:2;color:var(--ink2);margin:0 0 34px}
  .tiny{font-size:11px;color:var(--ink3);line-height:1.8;margin:22px 0 0;letter-spacing:.5px}

  /* ---------- 开局 ---------- */
  .setup{padding-top:10px}
  .q{font-family:var(--kai);font-size:20px;font-weight:400;letter-spacing:2px;margin:28px 0 14px;color:var(--ink)}
  .q:first-of-type{margin-top:6px}
  .name-input{
    width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
    font-family:var(--kai);font-size:26px;color:var(--ink);padding:6px 2px 10px;outline:none;
    letter-spacing:4px;
  }
  .name-input:focus{border-color:var(--red)}
  .name-input::placeholder{color:rgba(43,38,33,.2)}
  .majors{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .colleges{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .col{
    appearance:none;border:1px solid var(--line);background:transparent;text-align:left;
    padding:13px;border-radius:2px;cursor:pointer;display:flex;flex-direction:column;gap:4px;
    transition:background .18s,border-color .18s,transform .12s;
  }
  .col:hover{background:rgba(43,38,33,.04);border-color:rgba(43,38,33,.3);transform:translateX(2px)}
  .back{
    appearance:none;border:none;background:transparent;color:var(--ink3);
    font-family:var(--sans);font-size:12px;letter-spacing:1px;cursor:pointer;
    padding:0;margin:0 0 12px;
  }
  .back:hover{color:var(--red)}
  .opts{display:flex;flex-wrap:wrap;gap:7px}
  .opts.yr{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
  .opts.yr .opt{padding:7px 4px;align-items:center}
  .opts.yr .o-main{font-size:13px;letter-spacing:0}
  .opts.yr .o-note{font-size:9.5px}
  .opt{
    appearance:none;border:1px solid var(--line);background:transparent;
    font-family:var(--sans);font-size:13px;color:var(--ink);cursor:pointer;
    padding:8px 13px;border-radius:2px;display:flex;flex-direction:column;gap:2px;
    align-items:flex-start;transition:background .18s,border-color .18s;
  }
  .opt:hover{background:rgba(43,38,33,.04)}
  .opt.on{background:rgba(156,59,48,.07);border-color:var(--red)}
  .o-note{font-size:10px;color:var(--ink3);letter-spacing:.3px}
  .opt.on .o-note{color:var(--red);opacity:.85}
  .hint{font-size:11.5px;color:var(--ink3);margin:9px 0 0;letter-spacing:.3px}
  .provs{margin-top:2px}
  .rgroup{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
  .rname{flex:0 0 42px;font-size:10.5px;color:var(--ink3);letter-spacing:1px;padding-top:7px}
  .pgrid{display:flex;flex-wrap:wrap;gap:5px;flex:1}
  .prov{
    appearance:none;border:1px solid var(--line);background:transparent;
    font-family:var(--sans);font-size:12px;color:var(--ink);
    padding:5px 9px;border-radius:2px;cursor:pointer;transition:background .15s,border-color .15s;
  }
  .prov:hover{background:rgba(43,38,33,.05)}
  .prov.on{background:rgba(156,59,48,.08);border-color:var(--red);color:var(--red)}
  .allow-row{display:flex;align-items:baseline;gap:6px;margin-top:2px}
  .allow-yen{font-family:var(--kai);font-size:20px;color:var(--ink3)}
  .allow-input{
    width:170px;background:transparent;border:none;border-bottom:1px solid var(--line);
    font-family:var(--kai);font-size:22px;color:var(--ink);padding:4px 2px 6px;outline:none;
  }
  .allow-input:focus{border-color:var(--red)}
  .allow-unit{font-size:12px;color:var(--ink3)}
  .wins{display:flex;flex-direction:column;gap:9px;margin-top:16px}  .win{
    appearance:none;border:1px solid var(--line);background:transparent;text-align:left;
    padding:14px 16px;border-radius:2px;cursor:pointer;display:flex;gap:14px;align-items:center;
    transition:background .18s,border-color .18s,transform .12s;
  }
  .win:hover{background:rgba(43,38,33,.04);border-color:rgba(43,38,33,.3);transform:translateX(3px)}
  .w-ico{font-size:23px;line-height:1;width:28px;text-align:center}
  .w-body{display:flex;flex-direction:column;gap:3px;flex:1}
  .w-name{font-family:var(--kai);font-size:17px;color:var(--ink);letter-spacing:1px}
  .w-desc{font-size:11.5px;color:var(--ink3)}
  .w-n{font-size:10.5px;color:var(--ink3);border:1px solid var(--line);border-radius:2px;padding:2px 6px}
  .places{display:flex;flex-direction:column;gap:9px;margin-top:16px}
  .place{
    appearance:none;border:1px solid var(--line);background:transparent;text-align:left;
    padding:13px 15px;border-radius:2px;cursor:pointer;display:flex;flex-direction:column;gap:4px;
    transition:background .18s,border-color .18s,transform .12s;
  }
  .place:hover{background:rgba(43,38,33,.04);border-color:rgba(43,38,33,.3);transform:translateX(3px)}
  .p-name{font-family:var(--kai);font-size:16px;color:var(--ink);letter-spacing:1px}
  .p-note{font-size:11px;color:var(--ink3)}
  .p-n{font-size:10px;color:var(--ink3);opacity:.8}
  .major.off{opacity:.4;cursor:not-allowed}
  .major.off:hover{background:transparent}
  .m-note{font-size:10.5px;color:var(--red);margin-top:3px;opacity:.9}
  .btn:disabled{opacity:.3;cursor:not-allowed}
  .btn:disabled:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .major{
    appearance:none;border:1px solid var(--line);background:transparent;text-align:left;
    padding:12px 13px;border-radius:2px;cursor:pointer;display:flex;flex-direction:column;gap:4px;
    transition:background .18s,border-color .18s;
  }
  .major:hover{background:rgba(43,38,33,.04)}
  .major.on{background:rgba(156,59,48,.06);border-color:var(--red)}
  .m-tag{font-size:10px;letter-spacing:2px;color:var(--ink3)}
  .m-name{font-family:var(--kai);font-size:16px;color:var(--ink)}
  .m-col{font-size:10.5px;color:var(--ink3)}
  .m-line{font-size:10.5px;color:var(--ink2);line-height:1.55;margin-top:3px;opacity:.85}

  /* ---------- 结局 ---------- */
  .end{padding-top:6px}
  .cert{
    position:relative;border:1px solid rgba(156,59,48,.35);background:rgba(255,255,255,.32);
    padding:26px 24px;margin-bottom:30px;border-radius:2px;
  }
  .cert::before{
    content:"";position:absolute;inset:5px;border:1px solid rgba(156,59,48,.16);pointer-events:none;
  }

<script>
(function (g) {

    '第一个学期结束。你终于知道一食堂几点人最少。',
    '大一下结束。成都的夏天来了，宿舍的空调开始整夜响。',
    '大二上结束。你开始觉得，四年好像也没那么长。',

  ];
  var KEYS = ['gpa', 'english', 'skill', 'network', 'fitness', 'mood', 'money', 'resume', 'prep', 'fail'];
  var LABEL = {
    gpa: '绩点', english: '英语', skill: '技能', network: '人脉', fitness: '体魄',
    mood: '心情', money: '金钱', resume: '履历', prep: '备考', fail: '挂科'
  };
  var CLAMP = { gpa: [0, 4], english: [0, 100], skill: [0, 100], network: [0, 100], fitness: [0, 100], mood: [0, 100], resume: [0, 100], prep: [0, 100] };

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function jitter(v) { return v * (0.82 + Math.random() * 0.36); }
  function deep(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---------------- 状态 ---------------- */

  function newGame(o) {
    o = o || {};
    var mj = GD.MAJORS[o.major] ? o.major : 'cs';
    var year = GD.YEARS.indexOf(o.year) >= 0 ? o.year : 2023;
    var gender = 'm', i;
    for (i = 0; i < GD.GENDERS.length; i++) if (GD.GENDERS[i].k === o.gender) gender = o.gender;

    var prov = null, far = 2;
    for (i = 0; i < GD.PROVINCES.length; i++) {

    }

    allow = Math.max(GD.ALLOW_MIN, Math.min(GD.ALLOW_MAX, allow));

    var s = {
      name: (o.name || '').trim() || '李想',
      major: mj,
      cat: GD.MAJORS[mj].cat,
      year: year, prov: prov[0], provName: prov[1], far: far,
      food: prov[4], accent: prov[5], folk: prov[6],
      allow: allow, gender: gender,
      ch: 1, month: 1, energy: 100, slots: 6, attended: false, monthLog: [], summary: null,
      absent: 0, fails: 0, retake: false, awards: [], comps: [],
      vet: false, calJump: 0, debuff: 0, enlistChoice: null,
      club: null, clubAct: 0, clubHonor: 0, thesis: 0, ledger: { in: 0, out: 0 },
      seen: [], highlights: [],
      gpa: 3.0, english: 40, skill: 20, network: 20, fitness: 60,
      mood: 80, money: allow * 2, resume: 0, prep: 0, fail: 0,
      direction: null, rom: 0, flags: {},
      ended: null, scene: null, snapshot: null, lastAction: null
    };
    var b = GD.MAJORS[s.major].boost || {};
    for (var k in b) s[k] = clamp(s[k] + b[k], 0, 100);

    /* 离得越远，越孤单一点；四川本地的同学多 */
    s.mood = clamp(s.mood + (2 - far * 2), 0, 100);
    s.network = clamp(s.network + (4 - far * 2), 0, 100);

    /* 生活费：手头紧的人心情低一点，宽裕的高一点 */
    var am = allow < 900 ? -6 : allow < 1300 ? -3 : allow < 2000 ? 0 : allow < 3500 ? 3 : 5;
    s.mood = clamp(s.mood + am, 0, 100);

    s.scene = { kind: 'cover' };
    return s;
  }

  /* ---------------- 数值结算 ---------------- */

  function apply(s, eff) {
    var out = [];
    if (!eff) return out;
    for (var k in eff) {
      if (KEYS.indexOf(k) < 0) continue;
      var v = eff[k], before = s[k];
      var delta = (k === 'fail') ? v : jitter(v);
      if (k === 'money') delta = Math.round(delta / 10) * 10;
      else if (k === 'gpa') delta = Math.round(delta * 100) / 100;
      else delta = Math.round(delta);
      s[k] = s[k] + delta;
      if (CLAMP[k]) s[k] = clamp(s[k], CLAMP[k][0], CLAMP[k][1]);
      var real = Math.round((s[k] - before) * 100) / 100;
      if (k === 'money' && real) {
        s.ledger = s.ledger || { in: 0, out: 0 };
        if (real > 0) s.ledger.in += real; else s.ledger.out -= real;
      }
      if (real !== 0) out.push({ k: k, label: LABEL[k], v: real });
    }
    return out;
  }

  function pickChoice(s, ch) {
    var diff = apply(s, ch.e || {});
    if (ch.set) s.direction = ch.set;
    if (typeof ch.rom === 'number') s.rom = ch.rom;
    if (ch.flag) s.flags[ch.flag] = true;
    if (ch.log) s.highlights.push({ ch: s.ch, t: ch.log });
    if (typeof ch.enlist === 'boolean') s.enlistChoice = ch.enlist;
    if (typeof ch.club === 'string') {
      s.club = (ch.club === 'none') ? null : ch.club;
      s.clubAct = 0;
    }
    return diff;
  }

  /* ---------------- 事件池 ---------------- */

  function mainOf(n) {
    for (var i = 0; i < GD.EVENTS.length; i++) {
      var e = GD.EVENTS[i];
      if (e.main && e.ch[0] === n) return e;
    }
    return null;
  }

  function poolFor(s) {
    return GD.EVENTS.filter(function (e) {
      if (e.main) return false;
      if (s.seen.indexOf(e.id) >= 0) return false;
      if (s.ch < e.ch[0] || s.ch > e.ch[1]) return false;
      if (e.major && e.major.indexOf(s.major) < 0) return false;
      if (e.cat && e.cat !== s.cat) return false;
      if (e.yearMax && s.year > e.yearMax) return false;
      if (e.yearMin && s.year < e.yearMin) return false;
      if (e.home && e.home.indexOf(s.home) < 0) return false;
      if (e.farMin && s.far < e.farMin) return false;
      if (e.prov && e.prov.indexOf(s.prov) < 0) return false;
      if (e.dir && e.dir !== s.direction) return false;
      if (e.rom && s.rom < e.rom) return false;
      if (e.flag && !s.flags[e.flag]) return false;
      if (e.noflag && s.flags[e.noflag]) return false;
      return true;
    });
  }

  /* 事件文案可以是字符串，也可以是随开局设定变化的函数 */
  function textOf(e, s) {
    return typeof e.text === 'function' ? e.text(s) : e.text;
  }

  function drawEvent(s) {
    var pool = poolFor(s);
    if (!pool.length) return null;
    var total = 0, i;
    for (i = 0; i < pool.length; i++) total += (pool[i].w || 1);
    var r = Math.random() * total;
    for (i = 0; i < pool.length; i++) {
      r -= (pool[i].w || 1);
      if (r <= 0) { s.seen.push(pool[i].id); return pool[i]; }
    }
    s.seen.push(pool[0].id);
    return pool[0];
  }

  /* ---------------- 派生分 ---------------- */

  function norm(s) { return s.gpa / 4 * 100; }

  function scores(s) {
    var T = GD.TUNE, g = norm(s);
    var vb = s.vet ? 12 : 0;
    return {
      kaoyan: g * T.kaoyan.gpa + s.english * T.kaoyan.eng + s.prep * T.kaoyan.prep + s.mood * T.kaoyan.mood + vb,
      kaogong: s.prep * T.kaogong.prep + s.skill * T.kaogong.skill + s.english * T.kaogong.eng + s.network * T.kaogong.net + s.mood * T.kaogong.mood + g * T.kaogong.gpa,
      job: s.skill * T.job.skill + s.resume * T.job.resume + s.network * T.job.net + g * T.job.gpa
    };
  }

  function evaluate(s, fin) {
    var T = GD.TUNE, sc = fin || scores(s);
    if (s.mood <= T.moodLine) return 'burnout';

    if (s.fails === 0 && s.awards.length >= GD.BAOYAN.awards &&
        zongce(s) >= GD.BAOYAN.zongce &&

    if (s.direction === 'kaoyan' && sc.kaoyan >= T.kaoyan.need) return 'kaoyan';
    if (s.direction === 'kaogong' && sc.kaogong >= T.kaogong.need) return 'kaogong';
    if (sc.job >= T.job.need) return 'bigco';
    if (sc.job >= T.stable.need) return 'stable';
    return 'idle';
  }

  /* 临场发挥：复试 / 面试 / 运气，统一 ±9%（就业 ±6%） */
  function luck(spread) {
    return 1 - spread + Math.random() * spread * 2;
  }

  /* ---------------- 流程 ---------------- */

  /* ---------------- 流程（按月推进） ---------------- */

  var MONTHS = ['9 月', '10 月', '11 月', '12 月', '1 月', '2 月', '3 月', '4 月', '5 月', '6 月', '7 月', '8 月'];

  function monthLabel(s) {
    var off = s.month - 1;
    var num = (off + 8) % 12 + 1;
    var y = s.year + Math.floor((off + 8) / 12) + (s.calJump || 0);
    return y + ' 年 ' + num + ' 月';
  }

  function seasonOfM(m) {
    if (m >= 9 && m <= 11) return 'autumn';
    if (m === 12 || m <= 2) return 'winter';
    if (m >= 3 && m <= 5) return 'spring';
    return 'summer';
  }

  function pickMonthLine(s) {
    var used = s.lines || (s.lines = {});
    var sea = seasonOfM(naturalMonth(s));
    var y = Math.ceil(s.month / 12);
    function pool() {
      return GD.MONTH_LINES.filter(function (l) {
        if (used[l.id]) return false;
        if (l.sea && l.sea !== sea) return false;
        if (l.y && y < l.y) return false;
        return true;
      });
    }
    var p = pool();
    if (!p.length) { s.lines = used = {}; p = pool(); }
    if (!p.length) return null;
    var one = p[Math.floor(Math.random() * p.length)];
    used[one.id] = 1;
    return one;
  }

  function beginMonth(s) {
    if (s.month > 48) return finish(s);
    s.ch = Math.ceil(s.month / 6);
    /* 重修学期：两小时被重修课吃掉 */
    if ((s.month - 1) % 6 === 0) s.retake = s.fails > 0;
    s.slots = GD.MONTH_SLOTS;
    if (s.debuff > 0) s.debuff -= 1;
    var ml = pickMonthLine(s);
    s.monthLine = ml ? ml.t : '';
    if (ml && ml.e) apply(s, ml.e);
    s.attended = false;
    s.monthLog = [];
    s.snapshot = deep({
      name: s.name, major: s.major, cat: s.cat, ch: s.ch, month: s.month, energy: s.energy,
      slots: s.slots, attended: s.attended, absent: s.absent,
      fails: s.fails, retake: s.retake, awards: s.awards, comps: s.comps,

    if (s.summary) {

    var en = maybeEnlist(s);

    return s;

    };

        winName: w.name, placeName: p.name, itemName: it.name, hours: 0
      };
      return s;
    }
    s.slots -= d.slots;
    s.monthLog.push({ name: it.name });
    var tired = s.energy < 15 ? 0.7 : 1;
    var rusty = (s.debuff > 0 && (winId === 'study' || winId === 'prep')) ? 0.6 : 1;
    var k = d.eff * GD.BASE_SCALE * tired * rusty;

    var eff = {};
    for (var key in it.eff) {
      if (key === 'gpa') eff[key] = it.eff[key] * k;
      else eff[key] = Math.round(it.eff[key] * k);
    }
    if (d.m === 3) eff.mood = (eff.mood || 0) + GD.LONG_MOOD;

    var diff = apply(s, eff);
    if (typeof it.eff.rom === 'number') s.rom = Math.min(4, s.rom + it.eff.rom);

    /* 社团活跃度：参加活动和当负责人都在攒 */
    if (winId === 'study' || winId === 'prep') s.semStudy = (s.semStudy || 0) + 1;
    if (it.id === 'thesis') s.thesis = clamp((s.thesis || 0) + 12, 0, 100);
    if (s.club && (it.id === 'join' || it.id === 'lead')) {
      var add = it.id === 'lead' ? 16 : 9;
      s.clubAct = clamp(s.clubAct + add, 0, 100);
      diff.push({ k: 'club', label: '社团', v: add });
    }

    /* 老乡会对离家远的人格外有用 */
    if (it.id === 'meet' && s.far > 0) {
      var before = s.mood;
      s.mood = clamp(s.mood + s.far, 0, 100);
      var gain = s.mood - before;
      if (gain > 0) diff.push({ k: 'mood', label: '心情', v: gain });
    }

    /* 精力 */
    var base = GD.ITEM_COST[it.id] || 12;
    var e0 = s.energy;
    s.energy = clamp(s.energy - Math.round(base * d.cost), 0, GD.ENERGY_MAX);
    var eDelta = Math.round(s.energy - e0);
    if (eDelta !== 0) diff.push({ k: 'energy', label: '精力', v: eDelta });
    if (s.energy <= 0 && eDelta < 0) {
      s.mood = clamp(s.mood - 2, 0, 100);
      diff.push({ k: 'mood', label: '心情', v: -2 });
    }

    s.lastAction = { name: it.name, diff: diff };
    if (s.mood <= 0) return finish(s);
    s.scene = {
      kind: 'effect', text: it.r + (GD.reactLine ? ' ' + GD.reactLine(winId, s) : ''), diff: diff, energy: Math.round(s.energy),
      winId: winId, placeId: placeId, itemId: it.id,
      winName: w.name, placeName: p.name, itemName: it.name, hours: d.hours,
      monthEnd: (s.month % 6 === 0)
    };
    return s;
  }

  /* ---------------- 上课 / 竞赛 / 综测 ---------------- */

  function naturalMonth(s) { return (s.month - 1 + 8) % 12 + 1; }

  function collegeKeyOf(s) {
    var m = GD.MAJORS[s.major];
    return m ? m.collegeKey : 'cs';
  }

  function coursesOf(s) {
    var pool = GD.COURSES[collegeKeyOf(s)] || ['专业课'];
    var n = GD.SEM_COURSE_COUNT[s.ch - 1] || 3;
    if (s.ch === 7) return ['就业指导'];
    if (s.ch === 8) return ['毕业设计'];
    var yr = Math.min(4, Math.ceil(s.ch / 2));
    var pub = GD.PUBLIC[yr] || [];
    var list = pub.slice(0, Math.min(2, n, pub.length));
    while (list.length < n) list.push(pool[(s.ch * 2 + list.length) % pool.length]);
    return list;
  }

  function classSlots(s) { return GD.CLASS_SLOTS[s.ch - 1] || 2; }

  function attendClass(s) {
    if (s.attended) return hubScene(s);
    var cost = classSlots(s);
    if (s.slots < cost) return hubScene(s);
    var cs = coursesOf(s);
    s.slots -= cost;
    s.attended = true;
    var d = apply(s, { gpa: 0.006 });
    var e0 = s.energy;
    s.energy = clamp(s.energy - 6, 0, GD.ENERGY_MAX);
    d.push({ k: 'energy', label: '精力', v: Math.round(s.energy - e0) });
    s.monthLog.push({ name: '上课' });
    s.scene = {
      kind: 'effect', returnHub: true,
      text: '你去上了本学期的课：' + cs.join('、') + '。' +
        (s.retake ? '重修班的老师点到了你的名字。' : '点名点到你的时候，你答得很大声。'),
      diff: d, energy: Math.round(s.energy),
      winName: '上课', placeName: cs.join('、'), itemName: '本月课程', hours: cost
    };
    return s;
  }

  function myAbility(s, need) {
    return need.k === 'gpa' ? s.gpa / 4 * 100 : (s[need.k] || 0);
  }

  function openComps(s) {
    var mm = naturalMonth(s), taken = {};
    s.comps.forEach(function (c) { taken[c.id] = 1; });
    return GD.COMPS.filter(function (c) {
      return c.months.indexOf(mm) >= 0 && !taken[c.id];
    });
  }

  function compScene(s) {
    var list = openComps(s).map(function (c) {
      return {
        id: c.id, name: c.name, level: c.level, hours: c.hours, energy: c.energy, fee: c.fee,
        slots: c.level === 1 ? 1 : c.level === 2 ? 2 : 3,
        levelName: c.level === 1 ? '校级' : c.level === 2 ? '省级' : '国家级',
        needLabel: c.need.label, needReq: c.need.req, my: Math.round(myAbility(s, c.need))
      };
    });
    s.scene = {
      kind: 'comp', title: monthLabel(s), list: list,
      slots: s.slots, energy: Math.round(s.energy)
    };
    return s;
  }

  function runComp(s, compId) {
    var c = null;
    GD.COMPS.forEach(function (x) { if (x.id === compId) c = x; });
    if (!c) return hubScene(s);
    var need = c.level === 1 ? 1 : c.level === 2 ? 2 : 3;
    if (s.slots < need || s.energy < c.energy) {
      s.comps.push({ id: c.id, name: c.name, level: c.level, prize: '', month: s.month });
      s.scene = {
        kind: 'effect', returnHub: true,
        text: '你算了一下：这个比赛要 ' + need + ' 块时间、' + c.energy + ' 点精力，你这个月不够。',
        diff: [], energy: Math.round(s.energy),
        winName: '竞赛', placeName: c.name, itemName: '报名', hours: 0
      };
      return s;
    }
    s.slots -= need;
    s.monthLog.push({ name: c.name });
    var e0 = s.energy;
    s.energy = clamp(s.energy - c.energy, 0, GD.ENERGY_MAX);
    s.money -= c.fee;

    /* 能力越接近要求越稳，但能力不够也有 12% 的底子 */
    var my = myAbility(s, c.need);
    var ratio = Math.max(0, Math.min(1.4, my / c.need.req));
    var lvK = c.level === 3 ? 0.78 : c.level === 2 ? 0.9 : 1.05;
    var p = Math.min(0.94, (0.20 + 0.58 * ratio) * lvK);
    var roll = Math.random();
    var prize = roll < p * 0.2 ? '一等' : roll < p * 0.6 ? '二等' : roll < p ? '三等' : '';

    var d = [{ k: 'energy', label: '精力', v: Math.round(s.energy - e0) }];
    if (c.fee) d.push({ k: 'money', label: '金钱', v: -c.fee });

    var text;
    if (prize) {
      var rGain = c.level === 3 ? 8 : c.level === 2 ? 5 : 3;
      var b0 = s.resume;
      s.resume = clamp(s.resume + rGain, 0, 100);
      d.push({ k: 'resume', label: '履历', v: Math.round(s.resume - b0) });
      s.comps.push({ id: c.id, name: c.name, level: c.level, prize: prize, month: s.month });
      if (prize !== '三等') {
        s.awards.push({ id: c.id, name: c.name, level: c.level, prize: prize, month: s.month });
        s.highlights.push({ ch: s.ch, t: '你拿了' + c.name + '的' + prize + '等奖' });
      }
      text = '你代表学校参加了' + c.name + '，拿了' + prize + '等奖。证书发下来那天，你把它夹进了专业课的书里。';
    } else {
      s.comps.push({ id: c.id, name: c.name, level: c.level, prize: '', month: s.month });
      var m0 = s.mood;
      s.mood = clamp(s.mood - 3, 0, 100);
      d.push({ k: 'mood', label: '心情', v: Math.round(s.mood - m0) });
      text = '你在' + c.name + '里没拿到名次。评委的评语很客气，但意思很清楚。';
    }

    s.scene = {
      kind: 'effect', returnHub: true, text: text, diff: d,
      energy: Math.round(s.energy), winName: '竞赛', placeName: c.name,
      itemName: '参赛', hours: c.hours
    };
    return s;
  }

  function zongce(s) {
    var g = s.gpa / 4 * 100;
    var aw = Math.min(s.awards.length * 2.5, 30);
    var r = Math.min(s.resume, 100) * 0.2;
    var vet = s.vet ? 10 : 0;
    var ch = (s.clubHonor || 0) * GD.CLUB_HONOR.zongce;
    return Math.min(100, g * 0.6 + aw + r + vet + ch);
  }

  var ENLIST_MONTHS = [1, 13, 25, 37];   /* 大一上 / 大二上 / 大三上 / 大四上 的第一个月 */

  function maybeEnlist(s) {
    if (s.vet) return null;
    if (ENLIST_MONTHS.indexOf(s.month) < 0) return null;
    var key = 'enlist_' + s.month;
    if (s.flags[key]) return null;
    s.flags[key] = true;
    var grade = ['大一', '大二', '大三', '大四'][ENLIST_MONTHS.indexOf(s.month)];
    s.scene = {
      kind: 'story', tag: 'enlist', title: '征兵宣传',
      text: '九月，学校的征兵宣传车又停在食堂门口了，横幅上写着“大学生应征入伍，保留学籍，退伍复学”。\n\n' +
        '辅导员在班群里发通知：服役两年，学费全免，退伍后可以重新选专业，考研还有专项计划。\n\n' +
        '你现在是' + grade + '。你把通知看了三遍。',
      choices: [
        { t: '报名参军，去部队待两年', e: { mood: 2 },
          r: '你在报名表上签了字。体检、政审、公示，一切都比你想的快。',
          enlist: true, log: grade + '，你报名参了军' },
        { t: '不去，把书读完', e: { mood: 3 },
          r: '你把通知划走了。第二天横幅还在，你已经不看它了。', enlist: false }
      ]
    };
    return s;
  }

  function doEnlist(s) {
    s.vet = true;
    s.calJump = 2;
    s.money += 25000;
    s.gpa = Math.max(0, Math.round((s.gpa - 0.25) * 100) / 100);
    s.english = clamp(s.english - 10, 0, 100);
    s.skill = clamp(s.skill - 10, 0, 100);
    s.resume = clamp(s.resume + 15, 0, 100);
    s.fitness = clamp(s.fitness + 15, 0, 100);
    s.mood = clamp(s.mood + 6, 0, 100);
    s.debuff = 3;
    s.highlights.push({ ch: s.ch, t: '你去当了两年兵，然后回来了' });
    s.scene = {
      kind: 'vet', title: '两年后',
      text: '两年。你站过凌晨四点的岗，跑过五公里越野，也学会了在二十分钟内把被子叠成豆腐块。\n\n' +
        '退伍那天，指导员把退伍证递给你，说“回去吧，好好读”。\n\n' +
        '你回到学校，学籍还在，宿舍换了人。退伍费到账：¥25,000。学费全免，学校给你重新选专业的机会。\n\n' +
        '只是你翻开课本的时候发现，大二学的东西，一个字都不记得了。'
    };
    return s;
  }

  function remajorScene(s, step, colKey) {
    if (step === 1) {
      s.scene = {
        kind: 'remajor', step: 1, title: '复学 · 重新选专业',
        text: '你可以重新选一个专业。',
        list: GD.COLLEGES.map(function (c) {
          return { key: c.key, name: c.name, note: c.majors.length + ' 个专业' };
        })
      };
      return s;
    }
    var col = null;
    GD.COLLEGES.forEach(function (c) { if (c.key === colKey) col = c; });
    s.scene = {
      kind: 'remajor', step: 2, title: col.name, colKey: colKey,
      text: '选一个你想读的。',
      list: col.majors.map(function (m) {
        var d = GD.MAJORS[m[0]];
        return { key: m[0], name: d.name, note: d.tag || '' };
      })
    };
    return s;
  }

  function defenseScene(s) {
    var t = s.thesis || 0;
    var g = s.gpa / 4 * 100;
    var score = Math.round(t * 0.62 + g * 0.22 + 12 + (Math.random() * 12 - 6));
    score = clamp(score, 20, 100);
    var verdict = score >= 85 ? '优秀' : score >= 60 ? '通过' : '不通过';
    s.scene = { kind: 'defense', score: score, verdict: verdict, thesis: t };
    return s;
  }

  function examScene(s) {
    var seen = {}, list = [];
    coursesOf(s).forEach(function (c) {
      var nm = (typeof c === 'string') ? c : (c.name || c.course || '课程');
      if (seen[nm]) return;
      seen[nm] = 1;
      list.push(c);
    });
    list = list.slice(0, 4);
    var absent = s.absent || 0;
    var study = s.semStudy || 0;
    var g = s.gpa / 4 * 100;
    var rows = list.map(function (c) {
      var nm = (typeof c === 'string') ? c : (c.name || c.course || '课程');
      var base = 38 + g * 0.32 + Math.min(study, 16) * 1.4 + (s.attended ? 6 : -6) - Math.min(absent, 4) * 5;
      var sc = Math.round(base + (Math.random() * 16 - 8));
      sc = clamp(sc, 0, 100);
      return { name: nm, score: sc, grade: sc >= 90 ? '优' : sc >= 80 ? '良' : sc >= 70 ? '中' : sc >= 60 ? '及格' : '不及格' };
    });
    var sum = 0;
    rows.forEach(function (r) { sum += r.score; });
    var avg = Math.round(sum / Math.max(1, rows.length));
    var fails = rows.filter(function (r) { return r.score < 60; }).length;
    var total = 42;
    var rank = Math.round(total * (1 - (avg - 45) / 55));
    rank = clamp(rank, 1, total);
    var note = absent >= 3 ? '你有几门课几乎没去过。' : absent > 0 ? '你缺过 ' + absent + ' 次课。' : '这个学期你一节没缺。';
    s.exam = { avg: avg, fails: fails, rank: rank, total: total };
    s.scene = {
      kind: 'exam', sem: s.ch, rows: rows, avg: avg, rank: rank, total: total,
      fails: fails, note: note
    };
    return s;
  }

  function settleScene(s) {
    var notes = [], lines = [];
    /* 缺课达 1/3（一学期 6 个月，缺 2 个月即算） */
    /* 学年末评十佳社团 */
    if (s.month % 12 === 0 && s.club && s.clubAct >= GD.CLUB_HONOR.need) {
      s.clubHonor += 1;
      s.resume = clamp(s.resume + GD.CLUB_HONOR.resume, 0, 100);
      lines.push('你们社团评上了这一学年的“十佳学生社团”。颁奖那天你在台下鼓掌，手都拍红了。');
      s.highlights.push({ ch: s.ch, t: '你所在的' + GD.CLUBS[s.club].name + '评上了十佳社团' });
      s.clubAct = Math.round(s.clubAct * 0.5);
    } else if (s.month % 12 === 0 && s.club) {
      s.clubAct = Math.round(s.clubAct * 0.5);
    }

    var wasRetake = s.retake;
    s.semStudy = 0;
    if (s.absent >= 3) {
      s.fails += 1;
      s.retake = true;
      notes.push('这个学期缺了 ' + s.absent + ' 个月的课，' +
        (wasRetake ? '重修没过，下学期还得再来一次。' : '挂了一门，下学期要重修。'));
    } else if (wasRetake) {
      s.retake = false;
      lines.push('重修通过了。挂科的记录还在，但这门课总算过了。');
    }
    s.absent = 0;
    s.mood = clamp(s.mood + 4, 0, 100);
    s.money += s.allow;
    s.ledger = s.ledger || { in: 0, out: 0 };
    s.ledger.in += s.allow;
    if (s.vet) { s.money += 800; s.ledger.in += 800; }

    var T = GD.FAR_TRAIT[s.far] || GD.FAR_TRAIT[2];
    s.money -= T.travel;
    s.mood = clamp(s.mood + T.homeMood, 0, 100);
    if (T.travel > 0) {
      lines.push('放了个假，来回一趟' + (s.far >= 2 ? '路上折腾' : '车票') + '花了 ¥' + T.travel + '。');
    }
    if (T.homeMood > 0) {
      lines.push('你在家待了几天，走的时候家里人往包里塞了不少东西。');
    } else if (T.homeMood < 0) {
      lines.push('你没有回家。宿舍楼下比平时安静很多。');
    }

    if (s.mood <= 0) return finish(s);
    s.scene = {
      kind: 'settle', title: SEM[s.ch - 1] + ' · 学期结束',
      text: SEM_END[s.ch - 1], notes: notes, lines: lines, ch: s.ch
    };
    return s;
  }

  function finish(s) {
    var raw = scores(s);
    var fin = {
      kaoyan: raw.kaoyan * luck(0.09),
      kaogong: raw.kaogong * luck(0.09),
      job: raw.job * luck(0.06)
    };
    s.ended = evaluate(s, fin);
    s.scene = { kind: 'end', key: s.ended, scores: fin };
    try { localStorage.removeItem('rcu4.save'); } catch (e) {}
    return s;
  }

  /* ---------------- 交互入口 ---------------- */

  function pick(s, i) {
    var sc = s.scene;
    if (!sc || !sc.kind) return hubScene(s);
    if (sc.kind === 'story') {
      var ch = sc.choices[i];
      if (!ch) return s;
      var diff = pickChoice(s, ch);
      s.scene = { kind: 'result', text: ch.r, diff: diff, tag: sc.tag, source: sc };
      return s;
    }
    if (sc.kind === 'result') {
      var src = s.scene.source;
      s.scene = src;
      return afterStory(s);
    }
    if (sc.kind === 'hub') {
      var w = sc.windows[i];
      if (!w) return s;
      return placeScene(s, w.id);
    }
    if (sc.kind === 'place') {
      var p = sc.places[i];
      if (!p) return s;
      return itemScene(s, sc.winId, p.id);
    }
    if (sc.kind === 'item') {
      var it = sc.items[i];
      if (!it) return s;
      if (it.fix) return useItem(s, sc.winId, sc.placeId, it.id, it.fix - 1);
      return durScene(s, sc.winId, sc.placeId, it.id);
    }
    if (sc.kind === 'dur') {
      if (!sc.opts[i]) return s;
      return useItem(s, sc.winId, sc.placeId, sc.itemId, i);
    }
    if (sc.kind === 'comp') {
      var cp = sc.list[i];
      if (!cp) return s;
      return runComp(s, cp.id);
    }
    if (sc.kind === 'effect') {
      return hubScene(s);
    }
    if (sc.kind === 'defense') {
      if (sc.verdict === '不通过') {
        s.fails += 2;
        s.mood = clamp(s.mood - 12, 0, 100);
      } else if (sc.verdict === '优秀') {
        s.resume = clamp(s.resume + 6, 0, 100);
        s.mood = clamp(s.mood + 6, 0, 100);
      } else {
        s.mood = clamp(s.mood + 2, 0, 100);
      }
      return settleScene(s);
    }
    if (sc.kind === 'exam') {
      var ex = s.exam || {};
      s.gpa = clamp(Math.round((s.gpa + (ex.avg - 78) / 100 * 0.14) * 100) / 100, 0, 4);
      if (ex.avg >= 85) s.mood = clamp(s.mood + 4, 0, 100);
      else if (ex.avg < 60) s.mood = clamp(s.mood - 8, 0, 100);
      if (ex.fails >= 2) s.fails += 1;
      if (ex.avg >= 85) s.resume = clamp(s.resume + 1, 0, 100);
      return settleScene(s);
    }
    if (sc.kind === 'vet') return remajorScene(s, 1);
    if (sc.kind === 'remajor') {
      var opt = sc.list[i];
      if (!opt) return s;
      if (sc.step === 1) return remajorScene(s, 2, opt.key);
      s.major = opt.key;
      s.cat = GD.MAJORS[opt.key].cat;
      s.highlights.push({ ch: s.ch, t: '复学后你转到了' + GD.MAJORS[opt.key].name });
      return hubScene(s);
    }
    if (sc.kind === 'summary') return beginMonth(s);
    if (sc.kind === 'settle') return advanceMonth(s);
    return hubScene(s);
  }

  /* 返回上一层，不消耗精力 */
  function navBack(s) {
    var sc = s.scene;
    if (sc.kind === 'place') return hubScene(s);
    if (sc.kind === 'item') return placeScene(s, sc.winId);
    if (sc.kind === 'dur') return itemScene(s, sc.winId, sc.placeId);
    if (sc.kind === 'comp') return hubScene(s);
    return s;
  }

  /* ---------------- 存档 ---------------- */

  var SAVE_KEY = 'rcu4.save';

  function save(s) {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, snap: s.snapshot }));
    } catch (e) {}
  }

  function hasSave() {
    try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  }

  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.snap) return null;
      var s = o.snap;
      s.seen = s.seen || [];
      s.highlights = s.highlights || [];
      s.flags = s.flags || {};
      if (!s.prov) { s.prov = 'sc'; s.provName = '四川'; s.far = 0; }
      if (!s.allow) s.allow = 1500;
      if (!s.month) s.month = 1;
      if (typeof s.energy !== 'number') s.energy = 100;
      s.scene = { kind: 'cover' };
      return beginMonth(s);
    } catch (e) { return null; }
  }

  function clear() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  }

  g.RCU = {
    SEM: SEM, LABEL: LABEL,
    newGame: newGame, beginMonth: beginMonth, pick: pick, endMonth: endMonth, navBack: navBack,
    monthLabel: monthLabel, attendClass: attendClass, compScene: compScene, runComp: runComp,
    zongce: zongce, naturalMonth: naturalMonth,
    hasSave: hasSave, load: load, clear: clear,
    evaluate: evaluate, scores: scores, norm: norm
  };

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function (g) {
  'use strict';
  var GD = g.GD, E = g.RCU;
  var root = document.getElementById('app');
  var S = null;
  var setup = { step: 0, name: '', gender: 'm', year: 2023, prov: 'sc', allow: 1500, college: null, major: null };

  function esc(t) {
    var s = String(t);
    if (S) {
      if (S.gender) s = s.replace(/\{P\}/g, GD.PARTNER[S.gender] || 'TA');
      s = s.replace(/\{PROV\}/g, S.provName || '')
        .replace(/\{FOOD\}/g, S.food || '')
        .replace(/\{ACCENT\}/g, S.accent || '')
        .replace(/\{FOLK\}/g, S.folk || '');
    }
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function cnYear(y) {
    var d = '〇一二三四五六七八九';
    return String(y).split('').map(function (c) { return d[+c]; }).join('');
  }
  function paras(t) {
    return String(t).split(/\n\n+/).map(function (p) {
      return '<p>' + esc(p) + '</p>';
    }).join('');
  }
  function el(html) {
    var d = document.createElement('div');
    d.innerHTML = html.trim();
    return d.firstElementChild;
  }

  /* ---------------- HUD ---------------- */

  function hudHTML() {
    var items = [
      ['绩点', S.gpa.toFixed(2)],
      ['英语', S.english],
      ['技能', S.skill],
      ['人脉', S.network],
      ['体魄', S.fitness],
      ['心情', S.mood],
      ['金钱', '¥' + S.money],
      ['履历', S.resume]
    ];
    if (S.ch >= 5) items.push(['备考', S.prep]);
    items.push(['综测', Math.round(E.zongce(S))]);
    if (S.club) items.push(['社团', S.clubAct]);
    items.push(['竞赛', S.awards.length]);
    if (S.fails > 0) items.push(['挂科', S.fails]);
    var dir = '';
    if (S.direction === 'kaoyan') dir = '<span class="dir dir-k">考研</span>';
    if (S.direction === 'kaogong') dir = '<span class="dir dir-g">考公</span>';
    if (S.direction === 'job') dir = '<span class="dir dir-j">就业</span>';

    var dots = '';
    for (var i = 1; i <= 8; i++) {
      dots += '<i class="' + (i < S.ch ? 'done' : (i === S.ch ? 'now' : '')) + '"></i>';
    }

    return '<div class="hud">' +
      '<div class="hud-top"><span class="sem">' + E.SEM[Math.min(S.ch, 8) - 1] + '</span>' + '<span class="pg">第 ' + (S.month || 1) + ' / 48 页</span>' +
      '<span class="bgm" id="bgmBtn" data-act="bgm">' + (BGM_ON ? '♪' : '✕') + '</span>' +
      '<span class="dots">' + dots + '</span>' + dir + '</div>' +
      '<div class="stats">' +
      items.map(function (it) { return '<span class="chip">' + it[0] + '<b>' + it[1] + '</b></span>'; }).join('') +
      '</div></div>';
  }

  /* ---------------- 视图 ---------------- */

  function coverView() {
    return '<div class="cover">' +
      '<div class="kicker">一款关于四年的文字游戏</div>' +
      '<h1>毕业那天<br><em>你会去哪</em></h1>' +
      '<p class="cover-sub">八个学期，二十四次行动。<br>推开学、玩、生活、社交、实践的窗，<br>每一扇后面都是你自己选的。</p>' +
      '<button class="btn primary" data-act="new">开始这四年</button>' +
      (E.hasSave() ? '<button class="btn ghost" data-act="resume">继续上次</button>' : '') +
      '<p class="tiny">虚构作品 · 校名、院系、人物均属虚构<br>约 12 分钟一局 · 支持手机</p>' +
      '</div>';
  }

  function collegeByKey(k) {
    for (var i = 0; i < GD.COLLEGES.length; i++) if (GD.COLLEGES[i].key === k) return GD.COLLEGES[i];
    return null;
  }

  function optChip(group, val, main, note, on) {
    return '<button class="opt' + (on ? ' on' : '') + '" data-act="opt" data-group="' + group + '" data-v="' + val + '">' +
      '<span class="o-main">' + esc(main) + '</span>' +
      (note ? '<span class="o-note">' + esc(note) + '</span>' : '') +
      '</button>';
  }

  function provHintText() {
    for (var i = 0; i < GD.PROVINCES.length; i++) {
      if (GD.PROVINCES[i][0] === setup.prov) {
        var p = GD.PROVINCES[i];
        return p[1] + ' · ' + (GD.FAR_TRAIT_HINT[p[3]] || '');
      }
    }
    return '';
  }

  function provincePicker() {
    return GD.REGIONS.map(function (r) {
      var chips = GD.PROVINCES.filter(function (p) { return p[2] === r.k; }).map(function (p) {
        return '<button class="prov' + (setup.prov === p[0] ? ' on' : '') + '" data-act="opt" data-group="p" data-v="' + p[0] + '">' + p[1] + '</button>';
      }).join('');
      return '<div class="rgroup"><span class="rname">' + r.name + '</span><div class="pgrid">' + chips + '</div></div>';
    }).join('');
  }

  function setupView() {
    if (setup.step === 0) {
      var g = GD.GENDERS.map(function (x) { return optChip('g', x.k, x.name, '', setup.gender === x.k); }).join('');
      var y = GD.YEARS.map(function (x) { return optChip('y', x, x, (x + 4) + ' 届', setup.year === x); }).join('');
      return '<div class="setup">' +
        '<div class="kicker">' + cnYear(setup.year) + ' 年，九月</div>' +
        '<h2 class="q">你叫什么？</h2>' +
        '<input id="nameInput" class="name-input" maxlength="8" placeholder="李想" value="' + esc(setup.name) + '">' +
        '<h2 class="q">你是</h2><div class="opts">' + g + '</div>' +
        '<h2 class="q">哪一年入学</h2><div class="opts yr">' + y + '</div>' +
        '<p class="hint" id="gradHint">你会在 ' + (setup.year + 4) + ' 年 6 月毕业。</p>' +
        '<h2 class="q">你来自</h2>' +
        '<div class="provs">' + provincePicker() + '</div>' +
        '<p class="hint" id="provHint">' + esc(provHintText()) + '</p>' +
        '<h2 class="q">每月生活费</h2>' +
        '<div class="allow-row">' +
        '<span class="allow-yen">¥</span>' +
        '<input id="allowInput" class="allow-input" type="number" min="' + GD.ALLOW_MIN + '" max="' + GD.ALLOW_MAX + '" step="100" value="' + setup.allow + '">' +
        '<span class="allow-unit">/ 月</span>' +
        '</div>' +
        '<p class="hint" id="allowHint">开局 ¥' + (setup.allow * 2) + '，之后每学期家里再打一个月。' +
        '（' + GD.ALLOW_MIN + '–' + GD.ALLOW_MAX + ' 元，可以自己填）</p>' +
        '<button class="btn primary" data-act="toCollege">下一步 · 选学院</button>' +
        '<p class="tiny">依据成都大学 20 个学院、' + GD.MAJOR_ORDER.length + ' 个本科专业设置。</p>' +
        '</div>';
    }

    if (setup.step === 1) {
      var cards = GD.COLLEGES.map(function (c) {
        return '<button class="col" data-act="col" data-k="' + c.key + '">' +
          '<span class="m-name">' + esc(c.name) + '</span>' +
          '<span class="m-col">' + c.majors.length + ' 个本科专业</span>' +
          '</button>';
      }).join('');
      return '<div class="setup">' +
        '<div class="kicker">' + cnYear(setup.year) + ' 年，九月</div>' +
        '<button class="back" data-act="back">← 改档案</button>' +
        '<h2 class="q">你被录取在</h2>' +
        '<div class="colleges">' + cards + '</div>' +
        '</div>';
    }

    var c = collegeByKey(setup.college);
    var list = c.majors.map(function (m) {
      var d = GD.MAJORS[m[0]];
      var ok = setup.year >= d.since;
      return '<button class="major' + (setup.major === m[0] ? ' on' : '') + (ok ? '' : ' off') + '"' +
        (ok ? ' data-act="maj" data-k="' + m[0] + '"' : ' disabled') + '>' +
        '<span class="m-name">' + esc(d.name) + '</span>' +
        (d.tag ? '<span class="m-tag">' + esc(d.tag) + '</span>' : '') +
        '<span class="m-line">' + esc(d.line) + '</span>' +
        (ok ? '' : '<span class="m-note">' + d.since + ' 年起开设</span>') +
        '</button>';
    }).join('');
    return '<div class="setup">' +
      '<button class="back" data-act="back">← 换个学院</button>' +
      '<h2 class="q">' + esc(c.name) + '</h2>' +
      '<div class="majors">' + list + '</div>' +
      '<button class="btn primary" data-act="go"' + (setup.major ? '' : ' disabled') + '>' +
      (setup.major ? '推开校门' : '先选一个专业') + '</button>' +
      '</div>';
  }

  function storyView(sc) {
    var ch = '';
    var n = sc.choices.length;
    sc.choices.forEach(function (c, i) {
      ch += '<button class="choice" data-act="pick" data-i="' + i + '">' + esc(c.t) + '</button>';
    });
    return '<div class="scene">' +
      '<div class="scene-title">' + esc(sc.title || '') + '</div>' +
      '<div class="prose">' + paras(sc.text) + '</div>' +
      '<div class="choices ' + (n > 3 ? 'four' : '') + '">' + ch + '</div>' +
      '</div>';
  }

  function resultView(sc) {
    var chips = (sc.diff || []).map(function (d) {
      var up = d.v > 0;
      var good = d.k === 'fail' ? false : up;
      return '<span class="delta ' + (good ? 'up' : 'down') + '">' + d.label + ' ' +
        (up ? '+' : '') + d.v + '</span>';
    }).join('');
    return '<div class="scene">' +
      '<div class="prose result-text">' + paras(sc.text) + '</div>' +
      '<div class="deltas">' + chips + '</div>' +
      '<button class="btn primary" data-act="cont">继续</button>' +
      '</div>';
  }

  function deltaChips(list) {
    return (list || []).map(function (d) {
      var up = d.v > 0, good = d.k === 'fail' ? false : up;
      return '<span class="delta ' + (good ? 'up' : 'down') + '">' + d.label + ' ' + (up ? '+' : '') + d.v + '</span>';
    }).join('');
  }

  /* ---------- 人物模型 ---------- */
  function avatarSVG() {
    var lowE = S.energy < 20, lowM = S.mood < 35;
    var stroke = lowM ? '#9c3b30' : '#2b2621';
    var mouth = S.mood >= 65 ? 'M50 62 Q60 70 70 62'
      : (S.mood >= 35 ? 'M50 64 L70 64' : 'M50 68 Q60 58 70 68');
    var e = Math.max(0, Math.min(100, S.energy));
    return '<svg class="avatar" viewBox="0 0 120 160" aria-hidden="true">' +
      '<circle cx="60" cy="78" r="52" fill="none" stroke="rgba(43,38,33,.07)" stroke-width="1"/>' +
      '<circle cx="60" cy="78" r="52" fill="none" stroke="' + (lowE ? '#9c3b30' : '#4c6b58') +
      '" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="' + (e / 100 * 327) + ' 327"' +
      ' transform="rotate(-90 60 78)" opacity=".55"/>' +
      '<g fill="none" stroke="' + stroke + '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' +
      '<ellipse cx="60" cy="50" rx="21" ry="25"/>' +
      '<path d="M39 44 Q60 22 81 44 Q70 33 60 33 Q50 33 39 44"/>' +
      '<path d="M49 74 L49 82"/><path d="M71 74 L71 82"/>' +
      '<path d="M28 140 Q31 100 47 89 Q60 96 73 89 Q89 100 92 140"/>' +
      '</g>' +
      '<g fill="' + stroke + '"><circle cx="52" cy="50" r="2.3"/><circle cx="68" cy="50" r="2.3"/></g>' +
      '<path d="' + mouth + '" fill="none" stroke="' + stroke + '" stroke-width="1.9" stroke-linecap="round"/>' +
      '</svg>';
  }

  function statLine() {
    var s = '精神不错';
    if (S.energy < 15) s = '快不行了';
    else if (S.energy < 40) s = '撑着呢';
    else if (S.energy < 70) s = '有点累';
    return s;
  }

  function stageInner(sc) {
    var crumb = '';
    if (sc.kind === 'hub') crumb = '这个月，你想做点什么？';
    else if (sc.kind === 'place') crumb = esc(sc.winName);
    else if (sc.kind === 'item') crumb = esc(sc.winName) + ' › ' + esc(sc.placeName);
    else if (sc.kind === 'dur') crumb = esc(sc.winName) + ' › ' + esc(sc.placeName) + ' › ' + esc(sc.itemName);
    else if (sc.kind === 'comp') crumb = '竞赛 · 本月开放 ' + sc.list.length + ' 个';
    else if (sc.kind === 'effect') crumb = esc(sc.itemName) + (sc.hours ? ' · ' + sc.hours + ' 小时' : '');

    var extra = '';

    return '<div class="g-date">' + esc(sc.title || E.monthLabel(S)) + '</div>' +
      (sc.line ? '<p class="month-line">' + esc(sc.line) + '</p>' : '') +
      avatarSVG() +
      '<div class="g-crumb">' + crumb + '</div>' +
      extra +
      '<div class="g-energy"><i style="width:' + Math.round(S.energy) + '%' +
      (S.energy < 20 ? ';background:#9c3b30' : '') + '"></i></div>' +
      '<div class="g-state">' + Math.round(S.energy) + ' / 100 · ' + statLine() +
      (typeof S.slots === 'number' ? ' · 本月剩 ' + S.slots + ' 块' : '') + '</div>';
  }

  function railInner(sc) {
    var html = '';
    if (sc.kind === 'hub') {
      html = '<button class="rbtn attend' + (sc.attended ? ' done' : '') + '" data-act="attend">' +
        '<span class="r-ico">🏫</span>' +
        '<span class="r-txt"><b>' + (sc.attended ? '今天上过课了' : '去上课') + '</b><i>' +
        (sc.retake ? '重修 · ' : '') + sc.courses.length + ' 门课 · 占 ' + sc.classSlots + ' 块</i></span>' +
        '</button>' +
        sc.windows.map(function (w, i) {
          return '<button class="rbtn" data-act="pick" data-i="' + i + '">' +
            '<span class="r-ico">' + w.icon + '</span>' +
            '<span class="r-txt"><b>' + esc(w.name) + '</b><i>' + esc(w.desc) + '</i></span>' +
            '</button>';
        }).join('') +
        (sc.comps ? '<button class="rbtn" data-act="comp">' +
          '<span class="r-ico">🏆</span><span class="r-txt"><b>竞赛</b><i>本月有 ' +
          sc.comps + ' 个比赛开放</i></span></button>' : '') +
        '<button class="rbtn go" data-act="nextmonth"><span class="r-txt"><b>翻到下一页</b>' +
        '<i>本月还剩 ' + sc.slots + ' 块时间</i></span></button>';
    } else if (sc.kind === 'place') {
      html = '<button class="back" data-act="nav">← 回去</button>' +
        sc.places.map(function (p, i) {
          return '<button class="rbtn" data-act="pick" data-i="' + i + '">' +
            '<span class="r-txt"><b>' + esc(p.name) + '</b><i>' + esc(p.note) + '</i></span>' +
            '</button>';
        }).join('');
    } else if (sc.kind === 'item') {
      html = '<button class="back" data-act="nav">← 回去</button>' +
        sc.items.map(function (it, i) {
          var c = it.cost;
          return '<button class="rbtn" data-act="pick" data-i="' + i + '">' +
            '<span class="r-txt"><b>' + esc(it.name) + '</b><i>' +
            (it.pay ? '¥' + (-it.pay) + ' · ' : '') +
            (it.fix ? '占 ' + it.fix + ' 块 · ' : '') +
            (c < 0 ? '回 ' + (-c) : '耗 ' + c) + ' 精力</i></span>' +
            '</button>';
        }).join('');
    } else if (sc.kind === 'dur') {
      html = '<button class="back" data-act="nav">← 回去</button>' +
        sc.opts.map(function (o, i) {
          var sign = o.cost < 0 ? '+' : '−';
          return '<button class="rbtn" data-act="pick" data-i="' + i + '">' +
            '<span class="r-txt"><b>' + esc(o.label) + '</b><i>' + esc(o.note) +
            ' · 精力 ' + sign + Math.abs(o.cost) + '</i></span>' +
            '</button>';
        }).join('');
    } else if (sc.kind === 'effect') {
      html =
        '<div class="scene-art">' + GD.artFor(sc.winId, sc.placeId, sc.itemId) + '</div>' +
        '<div class="scene-sum">' + esc(sc.winName) + ' · ' + esc(sc.placeName) + ' · ' +
          esc(sc.itemName) + (sc.hours ? ' · ' + sc.hours + ' 小时' : '') + '</div>' +
        '<div class="effect-text">' + paras(sc.text) + '</div>' +
        '<div class="deltas">' + deltaChips(sc.diff) + '</div>' +
        '<button class="rbtn go" data-act="cont"><span class="r-txt"><b>继续</b><i>回到这个月</i></span></button>';
    } else if (sc.kind === 'comp') {
      html = '<button class="back" data-act="nav">← 回去</button>' +
        (sc.list.length
          ? sc.list.map(function (c, i) {
            return '<button class="rbtn" data-act="pick" data-i="' + i + '">' +
              '<span class="r-txt"><b>' + esc(c.name) + '</b><i>' + c.levelName + ' · 需' + c.needLabel + ' ' + c.needReq + '（你 ' + c.my + '）' +
              ' · 精力 ' + c.energy + (c.fee ? ' · ¥' + c.fee : '') + '</i></span>' +
              '</button>';
          }).join('')
          : '<p class="empty">这个月没有开放的比赛。</p>');
    }
    if (sc.kind === 'place' || sc.kind === 'item' || sc.kind === 'dur' || sc.kind === 'comp') {
      html += '<button class="rbtn go skip" data-act="nextmonth">' +
        '<span class="r-txt"><b>翻到下一页</b><i>这一项不做了，直接过完这个月</i></span></button>';
    }
    return html;
  }

  function gameView(sc) {
    return '<div class="game"><div class="stage">' + stageInner(sc) + '</div>' +
      '<div class="rail">' + railInner(sc) + '</div></div>';
  }

  function summaryView(sc) {
    var d = sc.data || {};
    var acts = (d.acts || []).length
      ? d.acts.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('')
      : '<li class="none">什么也没做</li>';
    var lines = (d.lines || []).map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('');
    return '<div class="scene summary">' +
      '<div class="sum-tag">第 ' + Math.max(1, (S.month || 2) - 1) + ' 页 · ' + esc(d.month || '') + '</div>' +
      '<h2 class="sum-title">上一页写完了</h2>' +
      '<div class="sum-block"><span class="sum-lb">这个月你做了</span><ul class="sum-acts">' + acts + '</ul></div>' +
      (lines ? '<div class="sum-block"><span class="sum-lb">几句提醒</span><ul class="sum-lines">' + lines + '</ul></div>' : '') +
      '<div class="sum-stats">绩点 ' + (d.gpa || 0).toFixed(2) + ' · 心情 ' + (d.mood || 0) +
      ' · 精力 ' + (d.energy || 0) + '</div>' +
      '<button class="btn primary" data-act="cont">翻到这一页</button>' +
      '</div>';
  }

  function vetView(sc) {
    return '<div class="scene">' +
      '<div class="scene-title">' + esc(sc.title) + '</div>' +
      '<div class="prose">' + paras(sc.text) + '</div>' +
      '<button class="btn primary" data-act="cont">回到学校</button></div>';
  }

  function remajorView(sc) {
    var list = sc.list.map(function (o, i) {
      return '<button class="choice" data-act="pick" data-i="' + i + '">' + esc(o.name) +
        (o.note ? '  <span class="rm-note">' + esc(o.note) + '</span>' : '') + '</button>';
    }).join('');
    return '<div class="scene">' +
      '<div class="scene-title">' + esc(sc.title) + '</div>' +
      '<div class="prose"><p>' + esc(sc.text) + '</p></div>' +
      '<div class="choices">' + list + '</div></div>';
  }

  function defenseView(sc) {
    var tone = sc.verdict === '不通过' ? 'bad' : sc.verdict === '优秀' ? 'good' : '';
    var line = sc.thesis < 40 ? '你上台的时候，PPT 才做到第八页。'
      : sc.thesis < 70 ? '你讲了十二分钟，老师问了三个问题。'
      : '你讲了十五分钟，老师只问了一个问题。';
    return '<div class="scene">' +
      '<div class="scene-title">毕业论文答辩</div>' +
      '<div class="prose"><p>' + line + '</p></div>' +
      '<div class="def-score"><span>答辩成绩</span>' +
        '<b class="' + tone + '">' + sc.score + '</b>' +
        '<span class="def-verdict ' + tone + '">' + esc(sc.verdict) + '</span></div>' +
      '<button class="btn primary" data-act="cont">走下场</button></div>';
  }

  function examView(sc) {
    var rows = sc.rows.map(function (r) {
      return '<div class="ex-row">' +
        '<span class="ex-name">' + esc(r.name) + '</span>' +
        '<span class="ex-bar"><i style="width:' + r.score + '%"></i></span>' +
        '<span class="ex-score">' + r.score + '</span>' +
        '<span class="ex-grade' + (r.score < 60 ? ' bad' : '') + '">' + esc(r.grade) + '</span></div>';
    }).join('');
    return '<div class="scene">' +
      '<div class="scene-title">期末考试</div>' +
      '<div class="prose"><p>' + esc(sc.note) + '</p></div>' +
      '<div class="exam-paper">' + rows + '</div>' +
      '<p class="ex-rank">平均分 <b>' + sc.avg + '</b> · 班级排名 <b>' + sc.rank + '</b> / ' + sc.total + '</p>' +
      '<button class="btn primary" data-act="cont">交卷</button></div>';
  }

  function settleView(sc) {
    var notes = (sc.notes || []).map(function (n) { return '<p class="warn">' + esc(n) + '</p>'; }).join('');
    var lines = (sc.lines || []).map(function (n) { return '<p class="note">' + esc(n) + '</p>'; }).join('');
    return '<div class="scene">' +
      '<div class="scene-title">' + esc(sc.title) + '</div>' +
      '<div class="prose">' + paras(sc.text) + '</div>' +
      notes + lines +
      '<button class="btn primary" data-act="next">继续</button>' +
      '</div>';
  }

  function pickHighlights(list) {
    if (!list || !list.length) return [];
    var idx = [];
    var n = list.length;
    var slots = Math.min(5, n);
    for (var i = 0; i < slots; i++) {
      idx.push(Math.round(i * (n - 1) / Math.max(1, slots - 1)));
    }
    var out = [], used = {};
    idx.forEach(function (i) {
      if (!used[i] && list[i]) { used[i] = 1; out.push(list[i]); }
    });
    return out;
  }

  function endView(sc) {
    var en = GD.ENDINGS[sc.key];
    var m = GD.MAJORS[S.major];
    var cat = GD.CATS[m.cat];
    var gy = (S.year || 2022) + 4 + (m.five ? 1 : 0);
    var dest = (sc.key === 'bigco' || sc.key === 'stable') ? cat[sc.key] : en.dest;
    var fiveLine = m.five
      ? '<p class="rom">临床医学是五年制。这张成绩单只写到第四年，你还差一年才毕业。</p>'
      : '';
    var romLine = '';
    if (S.rom >= 4) romLine = '还有一件事没写进这张成绩单：那个人还在。';
    else if (S.rom >= 3) romLine = '你们约好了异地几年，这件事没写进上面。';
    var ledgerLine = '';
    if (S.ledger) {
      ledgerLine = '<p class="ledger">这四年进出的钱：收入 ¥' + Math.round(S.ledger.in) +
        ' · 支出 ¥' + Math.round(S.ledger.out) +
        ' · 最后剩 ¥' + Math.round(S.money) + '</p>';
    }
    var body = en.body.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
    var hl = pickHighlights(S.highlights).map(function (h) {
      var t = String(h.t).replace(/^大[一二三四]([上下]|暑假|寒假)?，?/, '');
      return '<li><span class="hl-ch">' + E.SEM[h.ch - 1] + '</span>' + esc(t) + '</li>';
    }).join('');
    var sc2 = sc.scores || {};
    var rows = [
      ['绩点', S.gpa.toFixed(2)], ['英语', S.english], ['技能', S.skill], ['人脉', S.network],
      ['体魄', S.fitness], ['心情', S.mood], ['履历', S.resume], ['备考', S.prep], ['金钱', '¥' + S.money]
    ].map(function (r) {
      return '<span class="chip">' + r[0] + '<b>' + r[1] + '</b></span>';
    }).join('');

    return '<div class="end">' +
      '<div class="cert">' +
      '<div class="cert-head">' + esc(GD.SCHOOL.name) + ' · ' + cnYear(gy) + '届</div>' +
      '<div class="cert-name">' + esc(S.name) + '</div>' +
      '<div class="cert-major">' + esc(m.name) + ' · ' + esc(m.college) + '</div>' +
      '<div class="cert-dest">去向 · ' + esc(dest) + '</div>' +
      '<div class="seal">' + esc(en.seal) + '</div>' +
      '</div>' +
      '<h2 class="end-title">' + esc(en.title) + '</h2>' +
      '<div class="prose">' + body + '</div>' +
      fiveLine +
      ledgerLine +
      (romLine ? '<p class="rom">' + romLine + '</p>' : '') +
      '<blockquote class="line">' + esc(en.line) + '</blockquote>' +
      (hl ? '<div class="review"><h3>四年里，你记得住的几件事</h3><ul>' + hl + '</ul></div>' : '') +
      '<div class="report">' +
      '<h3>成绩单</h3><div class="stats">' + rows + '</div>' +
      '<p class="tiny">考研分 ' + (sc2.kaoyan || 0).toFixed(0) +
      ' · 考公分 ' + (sc2.kaogong || 0).toFixed(0) +
      ' · 就业分 ' + (sc2.job || 0).toFixed(0) + '</p>' +
      '</div>' +
      '<button class="btn primary" data-act="again">再来一次</button>' +
      '</div>';
  }

  /* ---------------- 渲染 ---------------- */

  function seasonOf(s) {
    var forced = (location.hash.match(/season=(winter|spring|summer|autumn)/) || [])[1];
    if (forced) return forced;
    if (!s || !s.month) return 'autumn';
    var m = E.naturalMonth(s);
    if (m >= 9 && m <= 11) return 'autumn';
    if (m === 12 || m <= 2) return 'winter';
    if (m >= 3 && m <= 5) return 'spring';
    return 'summer';
  }

  function draw() {
    document.body.setAttribute('data-season', seasonOf(S));
    var sc = S ? S.scene : { kind: 'cover' };
    var head = '', body = '';

    if (sc.kind === 'cover') {
      head = '';
      body = coverView();
    } else if (sc.kind === 'setup') {
      body = setupView();
    } else {
      if (sc.kind !== 'end') head = hudHTML();
      if (sc.kind === 'story') body = storyView(sc);
      else if (sc.kind === 'result') body = resultView(sc);
      else if (sc.kind === 'summary') body = summaryView(sc);
      else if (sc.kind === 'settle') body = settleView(sc);
      else if (sc.kind === 'exam') body = examView(sc);
      else if (sc.kind === 'defense') body = defenseView(sc);
      else if (sc.kind === 'vet') body = vetView(sc);
      else if (sc.kind === 'remajor') body = remajorView(sc);
      else if (sc.kind === 'end') body = endView(sc);
      else body = gameView(sc);
    }

    root.innerHTML = '';
    root.appendChild(el('<div class="shell"><div class="head"></div><div class="body"></div></div>'));
    root.querySelector('.head').innerHTML = head;
    root.querySelector('.body').innerHTML = body;
    if (sc.kind === 'summary') {
      var sh = root.querySelector('.shell');
      if (sh) sh.classList.add('flip');
    }
    window.scrollTo(0, 0);
  }

  /* ---------------- 交互 ---------------- */

  root.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t && t.id === 'allowInput') {
      var v = parseInt(t.value, 10);
      if (isNaN(v)) return;
      setup.allow = v;
      var h = document.getElementById('allowHint');
      if (h) {
        h.textContent = '开局 ¥' + (v * 2) + '，之后每学期家里再打一个月。（' +
          GD.ALLOW_MIN + '–' + GD.ALLOW_MAX + ' 元，可以自己填）';
      }
    }
  });

  /* ---------- 声音 ---------- */
  var AC = null, BGM_ON = true, bgmTimer = null, bgmStep = 0;

  function audioCtx() {
    if (!AC) {
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }

  /* 点击音：一个很短的木质“嗒” */
  function tick() {
    var c = audioCtx();
    if (!c) return;
    var o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = 'triangle';
    o.frequency.setValueAtTime(760, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(320, c.currentTime + 0.05);
    f.type = 'lowpass'; f.frequency.value = 1800;
    g.gain.setValueAtTime(0.075, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008, c.currentTime + 0.07);
    o.connect(f); f.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.08);
  }

  /* 背景音乐：自制的五声音阶循环，纯 WebAudio 合成，不加载任何音频文件 */
  /* 四段情绪：大一轻快、大二舒展、大三提速、大四紧绷 */
  function bgmProfile() {
    var ch = (S && S.ch) || 1;
    if (ch <= 2) return { gap: 2100, scale: [0, 2, 4, 7, 9, 12, 9, 4], vol: 0.038, root: 174.6, pulse: 0 };
    if (ch <= 4) return { gap: 1850, scale: [0, 2, 4, 7, 9, 12, 14, 9], vol: 0.043, root: 164.8, pulse: 0 };
    if (ch <= 6) return { gap: 1400, scale: [0, 2, 4, 7, 9, 12, 7, 4], vol: 0.049, root: 155.6, pulse: 1 };
    return { gap: 950, scale: [0, 3, 5, 7, 10, 12, 7, 3], vol: 0.055, root: 146.8, pulse: 2 };
  }
  function bgmNote(freq, dur, vol) {
    var c = audioCtx();
    if (!c) return;
    var o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    o2.type = 'sine'; o2.frequency.value = freq * 2.005;
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); o2.connect(g); g.connect(c.destination);
    o.start(); o2.start(); o.stop(c.currentTime + dur); o2.stop(c.currentTime + dur);
  }
  function bgmTick() {
    if (!BGM_ON) { bgmTimer = null; return; }
    var pr = bgmProfile();
    var semi = pr.scale[bgmStep % pr.scale.length];
    var f = pr.root * Math.pow(2, semi / 12);
    bgmNote(f, pr.gap / 1000 * 1.7, pr.vol);
    if (bgmStep % 4 === 0) bgmNote(f / 2, pr.gap / 1000 * 2.2, pr.vol * 0.7);
    if (pr.pulse === 1 && bgmStep % 2 === 0) bgmNote(pr.root * 1.5, 0.28, pr.vol * 0.5);
    if (pr.pulse === 2) {
      bgmNote(pr.root * 1.5, 0.2, pr.vol * 0.55);
      if (bgmStep % 2 === 0) bgmNote(pr.root * 1.335, 0.18, pr.vol * 0.4);
    }
    bgmStep++;
    bgmTimer = setTimeout(bgmTick, pr.gap);
  }
  function startBgm() {
    if (bgmTimer) return;
    audioCtx();
    bgmTick();
  }
  function stopBgm() {
    if (bgmTimer) clearTimeout(bgmTimer);
    bgmTimer = null;
  }

  function haptic() {
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
  }

  function showConfirm(msg, onYes) {
    var d = document.createElement('div');
    d.className = 'mask';
    d.innerHTML = '<div class="dialog"><p>' + msg + '</p>' +
      '<div class="dbtns"><button class="dno">再想想</button>' +
      '<button class="dyes">确认进入</button></div></div>';
    document.body.appendChild(d);
    d.querySelector('.dno').onclick = function () { d.remove(); };
    d.querySelector('.dyes').onclick = function () { d.remove(); onYes(); };
  }

  root.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!b) return;
    tick();
    haptic();
    if (!bgmTimer) startBgm();
    var act = b.getAttribute('data-act');

    if (act === 'new') {
      setup.step = 0;
      setup.college = null;
      setup.major = null;
      S = { scene: { kind: 'setup' } };
      draw();
      setTimeout(function () {
        var inp = document.getElementById('nameInput');
        if (inp) inp.focus();
      }, 30);
      return;
    }

    if (act === 'resume') {
      var loaded = E.load();
      if (loaded) { S = loaded; draw(); }
      return;
    }

    if (act === 'toCollege') {
      var niT = document.getElementById('nameInput');
      if (niT) setup.name = niT.value;
      var ai = document.getElementById('allowInput');
      if (ai) {
        var av = parseInt(ai.value, 10);
        if (!isNaN(av)) setup.allow = Math.max(GD.ALLOW_MIN, Math.min(GD.ALLOW_MAX, av));
      }
      setup.step = 1;
      draw();
      return;
    }

    if (act === 'opt') {
      var group = b.getAttribute('data-group'), val = b.getAttribute('data-v');
      if (group === 'g') setup.gender = val;
      else if (group === 'y') setup.year = parseInt(val, 10);
      else if (group === 'p') setup.prov = val;
      else if (group === 'a') setup.allow = parseInt(val, 10);
      var sibs = root.querySelectorAll('[data-group="' + group + '"]');
      for (var i2 = 0; i2 < sibs.length; i2++) sibs[i2].classList.remove('on');
      b.classList.add('on');
      if (group === 'y') {
        var gh = document.getElementById('gradHint');
        if (gh) gh.textContent = '你会在 ' + (setup.year + 4) + ' 年 6 月毕业。';
        var kk = root.querySelector('.kicker');
        if (kk) kk.textContent = cnYear(setup.year) + ' 年，九月';
      }
      if (group === 'p') {
        var ph = document.getElementById('provHint');
        if (ph) ph.textContent = provHintText();
      }
      return;
    }

    if (act === 'col') {
      setup.college = b.getAttribute('data-k');
      setup.major = null;
      setup.step = 2;
      draw();
      return;
    }

    if (act === 'maj') {
      setup.major = b.getAttribute('data-k');
      draw();
      return;
    }

    if (act === 'back') {
      if (setup.step === 2) { setup.step = 1; setup.major = null; }
      else { setup.step = 0; setup.college = null; setup.major = null; }
      draw();
      return;
    }

    if (act === 'go') {
      S = E.newGame({
        name: setup.name, gender: setup.gender, year: setup.year,
        prov: setup.prov, allow: setup.allow, major: setup.major
      });
      E.beginMonth(S);
      draw();
      return;
    }

    if (act === 'pick') {
      E.pick(S, parseInt(b.getAttribute('data-i'), 10));
      draw();
      return;
    }

    if (act === 'cont') {
      E.pick(S, 0);
      draw();
      return;
    }

    if (act === 'next') {
      E.pick(S, 0);
      draw();
      return;
    }

    if (act === 'nav') {
      E.navBack(S);
      draw();
      return;
    }

    if (act === 'bgm') {
      BGM_ON = !BGM_ON;
      if (BGM_ON) { startBgm(); } else { stopBgm(); }
      draw();
      return;
    }

    if (act === 'attend') {
      E.attendClass(S);
      draw();
      return;
    }

    if (act === 'comp') {
      E.compScene(S);
      draw();
      return;
    }

    if (act === 'nextmonth') {
      if (S.slots > 0) {
        showConfirm('本月还剩 <b>' + S.slots + '</b> 块时间，' +
          (S.attended ? '' : '而且今天还没去上课。') + '<br>确定进入下个月吗？',
          function () { E.endMonth(S); draw(); });
      } else {
        E.endMonth(S);
        draw();
      }
      return;
    }

    if (act === 'again') {
      E.clear();
      S = null;
      draw();
      return;
    }
  });

  window.addEventListener('load', function () {
    draw();
  });
  if (document.readyState && document.readyState !== 'loading') draw();

})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
